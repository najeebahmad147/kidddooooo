<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunflower Rush</title>
<style>
  :root{
    --road:#3a3a42; --line:#f4f4f4; --bg:#1b1b22; --text:#fff;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:sans-serif;}
  #game{display:block;width:100%;height:100%;touch-action:none;}
  #hud{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:12px;color:var(--text);
    font-weight:800;font-size:18px;text-shadow:0 2px 4px #000;z-index:5;}
  #msg{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(0.5);
    color:#fff;font-weight:900;font-size:26px;text-shadow:0 3px 8px #000,0 0 20px #ff69b4;
    opacity:0;pointer-events:none;transition:transform .25s,opacity .25s;z-index:6;text-align:center;}
  #msg.show{opacity:1;transform:translate(-50%,-50%) scale(1);}
  .overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.72);z-index:10;}
  .hidden{display:none!important;}
  .box{background:#fff8e7;border-radius:20px;padding:28px 22px;max-width:88%;text-align:center;
    box-shadow:0 10px 40px rgba(0,0,0,.5);position:relative;min-height:180px;}
  .box p{font-size:19px;font-weight:800;color:#3a2a00;margin:0 0 22px;line-height:1.35;}
  .btnrow{display:flex;gap:16px;justify-content:center;position:relative;height:56px;}
  button{border:none;border-radius:12px;padding:12px 26px;font-size:17px;font-weight:800;
    cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);}
  #yes-btn{background:#4caf50;color:#fff;}
  #no-btn{background:#e53935;color:#fff;position:relative;}
  #no-btn.locked{opacity:.35;pointer-events:none;}
  #no-btn.dodge{position:fixed;transition:top .18s,left .18s;}
  #celebrate{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;}
  .cat{font-size:70px;margin-bottom:8vh;animation:pop .5s ease-out;}
  .bubble{position:absolute;bottom:23vh;background:#fff;border-radius:14px;padding:8px 16px;
    font-weight:900;font-size:18px;color:#c2185b;box-shadow:0 4px 12px rgba(0,0,0,.3);}
  @keyframes pop{from{transform:scale(0) translateY(40px);}to{transform:scale(1) translateY(0);}}
  .petal{position:fixed;top:-40px;font-size:28px;animation:fall linear forwards;z-index:19;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">🌻 0</div>
<div id="msg"></div>

<div id="popup" class="overlay hidden">
  <div class="box">
    <p id="popup-text"></p>
    <div class="btnrow">
      <button id="yes-btn">YES</button>
      <button id="no-btn">NO</button>
    </div>
  </div>
</div>

<div id="celebrate" class="hidden">
  <div class="cat">🐱</div>
  <div class="bubble">MEOWWW BACHA 💕</div>
</div>

<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize();addEventListener('resize',resize);

const hud=document.getElementById('hud');
const msgEl=document.getElementById('msg');
const popup=document.getElementById('popup');
const popupText=document.getElementById('popup-text');
const yesBtn=document.getElementById('yes-btn');
const noBtn=document.getElementById('no-btn');
const celebrate=document.getElementById('celebrate');

let roadOffset=0;
let carX=0.5;
let flowers=[];
let count=0;
let level=1;
let running=true;
const messages=["NICE ANGEL","EXCELLENT SWEET KIDDO","ANGEL","HONEY PIE","NOICEEE"];

function roadBounds(){
  const w=canvas.width*0.62;
  return {left:(canvas.width-w)/2, right:(canvas.width-w)/2+w, width:w};
}

function setCarFromClientX(clientX){
  const b=roadBounds();
  let x=(clientX-b.left)/b.width;
  carX=Math.max(0.06,Math.min(0.94,x));
}
canvas.addEventListener('touchmove',e=>{setCarFromClientX(e.touches[0].clientX);e.preventDefault();},{passive:false});
canvas.addEventListener('touchstart',e=>{setCarFromClientX(e.touches[0].clientX);},{passive:false});
canvas.addEventListener('mousedown',e=>{
  const move=ev=>setCarFromClientX(ev.clientX);
  setCarFromClientX(e.clientX);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',()=>window.removeEventListener('mousemove',move),{once:true});
});

function drawRoad(){
  ctx.fillStyle='#2e3d1f';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  const b=roadBounds();
  ctx.fillStyle='#3a3a42';
  ctx.fillRect(b.left,0,b.width,canvas.height);
  ctx.strokeStyle='#f4f4f4';
  ctx.lineWidth=6;
  ctx.setLineDash([28,26]);
  ctx.lineDashOffset=-roadOffset;
  ctx.beginPath();
  ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);
}

function carRect(){
  const b=roadBounds();
  const w=Math.min(b.width*0.22,70), h=w*1.7;
  const x=b.left+carX*b.width-w/2;
  const y=canvas.height-h-canvas.height*0.06;
  return {x,y,w,h};
}
function drawCar(){
  const {x,y,w,h}=carRect();
  ctx.save();
  ctx.fillStyle='#000';
  ctx.beginPath();ctx.roundRect(x-4,y-4,w+8,h+8,16);ctx.fill();
  ctx.fillStyle='#ffd400';
  ctx.beginPath();ctx.roundRect(x,y,w,h,14);ctx.fill();
  ctx.fillStyle='#000';
  ctx.fillRect(x+w*0.15,y+h*0.18,w*0.7,h*0.16);
  ctx.fillRect(x+w*0.15,y+h*0.62,w*0.7,h*0.16);
  ctx.fillStyle='#87ceeb';
  ctx.beginPath();ctx.roundRect(x+w*0.2,y+h*0.32,w*0.6,h*0.22,6);ctx.fill();
  ctx.restore();
}

function spawnFlower(){
  const b=roadBounds();
  flowers.push({x:b.left+Math.random()*b.width, y:-30, r:20, speed:3.4+level*0.3});
}
function drawFlower(f){
  ctx.save();ctx.translate(f.x,f.y);
  ctx.fillStyle='#fbc02d';
  for(let i=0;i<8;i++){
    ctx.save();ctx.rotate(i*Math.PI/4);
    ctx.beginPath();ctx.ellipse(0,-f.r,f.r*0.5,f.r,0,0,7);ctx.fill();
    ctx.restore();
  }
  ctx.fillStyle='#6d4c1c';
  ctx.beginPath();ctx.arc(0,0,f.r*0.55,0,7);ctx.fill();
  ctx.restore();
}

function showMessage(text){
  msgEl.textContent=text;
  msgEl.classList.remove('show');
  void msgEl.offsetWidth;
  msgEl.classList.add('show');
  clearTimeout(showMessage._t);
  showMessage._t=setTimeout(()=>msgEl.classList.remove('show'),900);
}

let spawnTimer=0;
function loop(){
  if(!running){requestAnimationFrame(loop);return;}
  roadOffset+=6;
  drawRoad();
  spawnTimer++;
  if(spawnTimer>55){spawnTimer=0;spawnFlower();}
  const car=carRect();
  flowers.forEach(f=>{
    f.y+=f.speed;
    drawFlower(f);
    const dx=f.x-(car.x+car.w/2), dy=f.y-(car.y+car.h*0.3);
    if(Math.abs(dx)<car.w*0.55 && Math.abs(dy)<car.h*0.5 && !f.hit){
      f.hit=true;
      onCollect();
    }
  });
  flowers=flowers.filter(f=>f.y<canvas.height+40 && !f.hit);
  drawCar();
  requestAnimationFrame(loop);
}

function onCollect(){
  count++;
  hud.textContent='🌻 '+count;
  showMessage(messages[(count-1)%messages.length]);
  if(count>=30){
    running=false;
    openPopup();
  }
}

function openPopup(){
  if(level===1){
    popupText.textContent="ARE YOU AGREE WITH YOUR BEWAKOOF?";
    noBtn.className='locked';
  }else{
    popupText.textContent="I HOPE YOU ARE HAPPY WITH THIS GAME. CAN YOU BE MY FRIEND?";
    noBtn.className='dodge';
    noBtn.style.position='fixed';
    placeCarAndBtn();
  }
  popup.classList.remove('hidden');
}
function placeCarAndBtn(){
  const w=innerWidth,h=innerHeight;
  noBtn.style.left=(30+Math.random()*(w-140))+'px';
  noBtn.style.top=(30+Math.random()*(h-140))+'px';
}
noBtn.addEventListener('click',()=>{
  if(noBtn.className.includes('dodge')) placeCarAndBtn();
});
noBtn.addEventListener('touchstart',()=>{
  if(noBtn.className.includes('dodge')) placeCarAndBtn();
});

yesBtn.addEventListener('click',()=>{
  popup.classList.add('hidden');
  noBtn.style.position='';noBtn.style.left='';noBtn.style.top='';
  if(level===1){
    level=2;count=0;flowers=[];hud.textContent='🌻 0';
    running=true;
  }else{
    celebrateNow();
  }
});

function celebrateNow(){
  celebrate.classList.remove('hidden');
  const petals=['🌻','🌸','🌼','💛'];
  for(let i=0;i<60;i++){
    setTimeout(()=>{
      const p=document.createElement('div');
      p.className='petal';
      p.textContent=petals[Math.floor(Math.random()*petals.length)];
      p.style.left=Math.random()*innerWidth+'px';
      p.style.animationDuration=(2+Math.random()*2)+'s';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),4000);
    },i*60);
  }
  fireworks();
}
function fireworks(){
  let particles=[];
  function burst(){
    const cx=Math.random()*canvas.width, cy=Math.random()*canvas.height*0.5+40;
    const color=`hsl(${Math.random()*360},90%,60%)`;
    for(let i=0;i<30;i++){
      const a=(i/30)*Math.PI*2;
      particles.push({x:cx,y:cy,vx:Math.cos(a)*4,vy:Math.sin(a)*4,life:60,color});
    }
  }
  let bursts=0;
  const fwInterval=setInterval(()=>{if(bursts++<6)burst();else clearInterval(fwInterval);},450);
  function fwLoop(){
    ctx.save();
    particles.forEach(p=>{
      p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;
      ctx.fillStyle=p.color;
      ctx.globalAlpha=Math.max(p.life/60,0);
      ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
    });
    ctx.restore();
    particles=particles.filter(p=>p.life>0);
    if(celebrate.classList.contains('hidden')===false){
      requestAnimationFrame(fwLoop);
    }
  }
  fwLoop();
}

loop();
</script>
</body>
</html>
